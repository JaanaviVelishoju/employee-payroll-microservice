server:
  port: 8081


spring:
  application:
    name: api-gate


  cloud:
    gateway:
      server:
        webflux:
           discovery:
             locator:
               enabled: true
               lower-case-service-id: true
           routes:
             - id : employee-service
               uri: lb://employee-service
               predicates:
                - Path=/employee/**

             - id: payroll-service
               uri: lb://payroll-service
               predicates:
                 - Path=/payroll/**



eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka