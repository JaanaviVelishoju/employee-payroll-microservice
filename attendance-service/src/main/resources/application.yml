server:
  port: 8083

spring:
  application:
    name: attendance-service

  datasource:
    url: jdbc:h2:mem:attendancedb
    driver-class-name: org.h2.Driver
    username: sa
    password: ''

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka